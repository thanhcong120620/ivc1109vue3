<!doctype html>
<html lang="vi">
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    .banner {
      position: relative;
      height: 300px; /* Chiều cao của banner */
      overflow: hidden;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-container {
      position: relative;
      top: -100px; /* Điều chỉnh để ảnh trồi lên từ banner */
      left: 50%; /* Căn giữa */
      transform: translateX(-50%); /* Căn giữa chính xác */
    }

    .overlay-image {
      max-width: 400px; /* Kích thước tối đa của ảnh */
      z-index: 10; /* Đảm bảo ảnh nằm trên banner */
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Thêm bóng cho hiệu ứng nổi */
      border-radius: 10px; /* Bo góc tùy chọn */
    }
  </style>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Over Banner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="banner">
      <img
        src="../../../assets/images/ivc-logo/avatarntc.jpg"
        alt="Banner Background"
        class="banner-img"
      />
    </div>
    <div class="image-container">
      <img
        src="https://demos.creative-tim.com/vue-now-ui-kit/img/hero-image-1.png"
        alt="Overlay Image"
        class="overlay-image"
      />
    </div>
  </body>
</html>
