<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
	<meta charset='utf-8'>
	<meta http-equiv='X-UA-Compatible' content='IE=edge'>
	<meta name='viewport' content='width=device-width, initial-scale=1'>

       <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <!-- <link rel="stylesheet" href="#" th:href="@{../IVC-CRM-CSS/CRM-Customer-Detail.css}" /> -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>

    <title>My Gmail pannel</title>
<style>
  body {
    background-color: #f8f9fa;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

h2 {
    color: #007bff;
}

h3 {
    margin-bottom: 1rem;
}

.table th, .table td {
    vertical-align: middle;
}

.modal-header .close {
    font-size: 1.5rem;
}

.btn {
    display: flex;
    align-items: center;
}

.btn i {
    margin-right: 5px;
}

@media (max-width: 768px) {
    .container {
        padding: 0 15px;
    }

    .row {
        flex-direction: column;
    }

    .col-md-4, .col-md-8 {
        width: 100%;
    }
}
</style>



  </head>

  <body>
   <div class="main-area">
      <div class="container mt-5">
        <h2 class="mb-4 text-center">IVC-Email Marketing</h2>
        <div class="row">
          <div class="col-md-8">
            <h3>Customer List</h3>
            <button class="btn btn-success mb-3 " id="addCustomerBtn">
              <i class="fas fa-plus"></i> Add Customer
            </button>
            <table class="table table-striped">
              <thead>
                <tr>
				  <th>Id</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Gender</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="customerTableBody">
                <!-- Customer rows will be added here dynamically -->
                <tr th:each="dto : ${userResponse}">
							<td th:text="${dto.id}"></td>
							<td th:text="${dto.fullName}"></td>
							<td th:text="${dto.gmail}"></td>
							<td th:text="${dto.genderUser}"></td>
				</tr>
              </tbody>
            </table>
          </div>
          <div class="col-md-4">
            <h3>Send Email</h3>
            <form id="emailForm" action="#" th:action="@{/send-all}" method="post" class="sendData">
              <div class="form-group">
                <label for="emailSubject">Subject</label>
                <input
                  class="form-control"
                  id="emailSubject"
                  required
                   th:name="subjectA" type="text" placeholder="Nhập tiêu đề trước khi gửi"
                />
              </div>
              <div class="form-group">
                <label for="emailContent">Content</label>
                <textarea
                  class="form-control"
                  id="emailContent"
                  rows="10"
                  placeholder="Enter email content"
                  required
                ></textarea>
              </div>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-paper-plane"></i> Send Email
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Modal for Adding/Editing Customer -->
      <div
        class="modal fade"
        id="customerModal"
        tabindex="-1"
        aria-labelledby="customerModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="customerModalLabel">
                Add/Edit Customer
              </h5>
              <button
                type="button"
                class="close"
                data-dismiss="modal"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <form id="customerForm">
                <div class="form-group">
                  <label for="customerName">Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="customerName"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="customerEmail">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="customerEmail"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="customerGender">Gender</label>
                  <select class="form-control" id="customerGender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary">
                  <i class="fas fa-save"></i> Save
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- JavaScript -->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
	<!-- <script src="#" th:src="@{../../../assets/js/IVC-CRM-JS/IVC-Email-MKT.js}"></script> -->
   <script>
     document.addEventListener('DOMContentLoaded', () => {
    const customerTableBody = document.getElementById('customerTableBody');
    const emailForm = document.getElementById('emailForm');
    const addCustomerBtn = document.getElementById('addCustomerBtn');
    const customerModal = new bootstrap.Modal(document.getElementById('customerModal'));
    const customerForm = document.getElementById('customerForm');
    let editIndex = null;
    let customers = [];

    function fetchCustomers() {
        fetch('/api/customers')
            .then(response => response.json())
            .then(data => {
                customers = data;
                renderCustomers();
            })
            .catch(error => console.error('Error fetching customers:', error));
    }

    function renderCustomers() {
        customerTableBody.innerHTML = '';
        customers.forEach((customer, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${customer.name}</td>
                <td>${customer.email}</td>
                <td>${customer.gender}</td>
                <td>
                    <button class="btn btn-primary btn-sm" onclick="editCustomer(${index})"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-danger btn-sm" onclick="deleteCustomer(${index})"><i class="fas fa-trash"></i></button>
                </td>
            `;
            customerTableBody.appendChild(tr);
        });
    }

    addCustomerBtn.addEventListener('click', () => {
        editIndex = null;
        customerForm.reset();
        customerModal.show();
    });

    customerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const customer = {
            name: document.getElementById('customerName').value,
            email: document.getElementById('customerEmail').value,
            gender: document.getElementById('customerGender').value,
        };
        if (editIndex !== null) {
            customers[editIndex] = customer;
        } else {
            customers.push(customer);
        }
        renderCustomers();
        customerModal.hide();
    });

    emailForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const subject = document.getElementById('emailSubject').value;
        const content = document.getElementById('emailContent').value;
        const emailList = customers.map(c => c.email).join(', ');
        alert(`Sending email to: ${emailList}\nSubject: ${subject}\nContent: ${content}`);
        // Here you can implement the email sending logic
    });

    window.editCustomer = (index) => {
        editIndex = index;
        const customer = customers[index];
        document.getElementById('customerName').value = customer.name;
        document.getElementById('customerEmail').value = customer.email;
        document.getElementById('customerGender').value = customer.gender;
        customerModal.show();
    };

    window.deleteCustomer = (index) => {
        customers.splice(index, 1);
        renderCustomers();
    };

    fetchCustomers();
});
   </script>
  </body>
</html>
